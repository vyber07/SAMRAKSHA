server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ───────────────────────────────────────────────────
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Enable XSS protection in older browsers
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer policy — no leakage to third parties
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions policy — restrict browser features not needed
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS — force HTTPS (enable only when TLS is terminated upstream)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Hide nginx version from response headers
    server_tokens off;

    # Block access to sensitive files — return 404 instead of leaking info
    location ~ /\.(env|git|htaccess|htpasswd|gitignore|dockerignore)$ {
        return 404;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy API requests to backend (no trailing slash — preserves path prefix)
    location /api/ {
        proxy_pass http://samraksha-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # WebSocket upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # Buffer tuning — prevent response buffering issues
        proxy_buffering off;
    }

    # SPA routing — serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (content-hashed by Vite — safe to cache 1y)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Override CSP for assets — no script-src needed
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; font-src 'self' data:" always;
    }
}
