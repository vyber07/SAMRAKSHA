<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Shield / Container -->
  <!-- Strict flat design, 4px border radius, Primary color #0B66D2 -->
  <rect x="15" y="15" width="70" height="70" rx="4" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="4" />
  
  <!-- Outer precision frame -->
  <rect x="25" y="25" width="50" height="50" rx="2" fill="#0B66D2" />
  
  <!-- Inner geometry (Security/Data nodes) -->
  <rect x="42" y="42" width="16" height="16" fill="#FAFAFA" />
  <rect x="46" y="25" width="8" height="17" fill="#FAFAFA" />
  <rect x="46" y="58" width="8" height="17" fill="#FAFAFA" />
  <rect x="25" y="46" width="17" height="8" fill="#FAFAFA" />
  <rect x="58" y="46" width="17" height="8" fill="#FAFAFA" />
</svg>
